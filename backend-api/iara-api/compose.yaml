services:

  # ============================================================
  # PostgreSQL + PostGIS
  # ============================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: iara-postgres
    environment:
      POSTGRES_DB: iara_db
      POSTGRES_USER: iara_user
      POSTGRES_PASSWORD: iara_pass
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d
      - iara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iara_user -d iara_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: iara-redis
    ports:
      - "6379:6379"
    volumes:
      - iara_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # RabbitMQ com painel de administração web
  # Acesse em http://localhost:15672
  # Login: guest / guest
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: iara-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - iara_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  iara_postgres_data:
  iara_redis_data:
  iara_rabbitmq_data:
