<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-iara.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B14" />
    <meta name="description" content="IARA — Plataforma de Comando e Controle da Defesa Civil" />
    <title>IARA · Comando e Controle</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- theme init: applied before React mounts to prevent flash -->
    <script>
      try {
        var s = localStorage.getItem('iara_theme');
        var t = s ? (JSON.parse(s)?.state?.theme ?? 'dark') : 'dark';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch(e) { document.documentElement.classList.add('dark'); }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
