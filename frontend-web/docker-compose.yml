# ============================================================
# IARA Web — frontend (build Vite + nginx)
#
# O nginx serve o SPA e faz reverse-proxy de /api -> backend Spring,
# resolvendo CORS. Ajuste BACKEND_URL conforme onde o backend roda:
#   - backend no host (fora do Docker):   http://host.docker.internal:8080
#   - backend no mesmo compose/rede:      http://iara-api:8080
# ============================================================
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iara-web
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
    extra_hosts:
      # permite alcançar o backend rodando na máquina host (Linux)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# Para colocar o frontend na MESMA rede do stack do backend
# (backend-api/iara-api/compose.yaml), descomente e use BACKEND_URL=http://iara-api:8080:
#
# networks:
#   default:
#     name: iara_default
#     external: true
